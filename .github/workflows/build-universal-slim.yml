name: Build single universal ComfyUI on python:3.12-slim (CPU builder)

on:
  workflow_dispatch:
  # Exact one-time operator-approved source push: future ordinary pushes do NOT
  # build automatically. Manual dispatch always remains available.
  push:
    branches: [main]
    paths:
      - .github/workflows/build-universal-slim.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: comfy-universal-slim-image
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == '[SLIM-OCI-BUILD]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify no private weights, tokens, workflows or GPU inference
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate.py --public
          python3 tools/verify_slim_source.py
      - name: Prepare disposable hosted CPU builder disk
        shell: bash
        run: |
          set -euo pipefail
          echo 'GitHub-hosted ephemeral CPU runner; never run these commands on Empower/Lover.'
          df -h / /var/lib/docker
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/chromium /usr/local/share/chromium-browser || true
          sudo docker system prune -af || true
          df -h / /var/lib/docker
          free_kib=$(df -Pk /var/lib/docker | awk 'NR==2 {print $4}')
          echo "Docker free GiB $((free_kib/1024/1024))"
          if (( free_kib < 27 * 1024 * 1024 )); then
            echo 'Insufficient hosted CPU builder disk; fail before fetching CUDA wheels.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/xcentralbox/comfyui-universal-slim
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/xcentralbox/gen-models-hf-runtime
            org.opencontainers.image.description=Experimental python:3.12-slim ComfyUI with combined public LTX and H3 nodes
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile.slim
          target: universal_slim
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Report immutable artifact (never enable HF GPU automatically)
        shell: bash
        run: |
          echo "Image: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'This image contains all currently redistributable LTX/H3/Qwen/audio nodes only; local user-defined overlays omitted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real image size, anonymous OCI pull, CPU startup, CUDA compatibility and HF model mounts still require independent verification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No HF Jobs, GPU inference, or production switch were launched.' >> "$GITHUB_STEP_SUMMARY"
