name: Build preinstalled ComfyUI GPU images (manual, NO GPU)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to build (no models or HF GPU inference)'
        required: true
        type: choice
        default: ltx
        options:
          - core
          - ltx
          - h3
          - qwen
          - audio

permissions:
  contents: read
  packages: write

concurrency:
  group: hf-oci-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    # Public repo: standard GitHub-hosted CPU runners (no GPU). Large PyTorch
    # builds might exceed runner's ~14 GiB free disk; fail rather than self-host.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate checked-in public files (no passwords/models)
        run: python3 tools/validate.py --public
      - name: Show builder disk budget
        run: df -h / /mnt || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/xcentralbox/comfyui-${{ inputs.profile }}
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/xcentralbox/gen-models-hf-runtime
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.profile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Output immutable SHA digest; do NOT arm HF production
        run: |
          echo "IMAGE=${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Requires GHCR package PUBLIC and unauthenticated pull validation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Building an image does not enable or start an HF GPU Job.' >> "$GITHUB_STEP_SUMMARY"
