name: CPU smoke of pinned universal-slim OCI (NO HF GPU)

on:
  workflow_dispatch:
  # One-time explicit user-authorized CPU test; no ordinary auto-rechecks.
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-universal-slim-cpu.yml

permissions:
  contents: read

concurrency:
  group: verify-universal-slim-oci-cpu
  cancel-in-progress: false

jobs:
  cpu:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == '[SLIM-CPU-DIAG]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OCI_IMAGE: ghcr.io/xcentralbox/comfyui-universal-slim@sha256:160e320bf9d0601cdcf8b6661371493c65c79cfe0daf0a8c2b4d8e5b208fda99
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate public source and pinned immutable image
        run: |
          python3 tools/validate.py --public
          python3 tools/verify_slim_source.py
          echo 'TEST CPU only; not an HF GPU job and not a Docker build.'
      - name: Free enough disk on disposable GitHub CPU VM
        shell: bash
        run: |
          set -euo pipefail
          df -h / /var/lib/docker
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/chromium /usr/local/share/chromium-browser || true
          sudo docker system prune -af || true
          df -h / /var/lib/docker
          free_kib=$(df -Pk /var/lib/docker | awk 'NR==2 {print $4}')
          if ((free_kib < 24 * 1024 * 1024)); then
            echo 'Insufficient disposable GitHub disk; refusing image download' >&2
            exit 1
          fi
      - name: Pull existing public OCI digest, no build or GitHub credentials
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI_IMAGE"
          docker image inspect "$OCI_IMAGE" --format 'IMAGE_ID={{.Id}} SIZE_BYTES={{.Size}} OS={{.Os}} ARCH={{.Architecture}}'
          df -h / /var/lib/docker
      - name: Containerized PyTorch CUDA wheel imports on CPU-only hardware
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --memory 6g --cpus 2 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            "$OCI_IMAGE" python -c "import pathlib,torch,torchvision,torchaudio,triton,transformers,diffusers,kornia,colour,OpenImageIO,websocket,peft,cv2,gguf; assert torch.version.cuda == '12.8',torch.version.cuda; assert not torch.cuda.is_available(); assert pathlib.Path('/comfyui/custom_nodes/ComfyUI-LTX2.5-MSR').is_dir(); assert pathlib.Path('/comfyui/custom_nodes/ComfyUI-H3-FaceRefine').is_dir(); print('CPU imports PASS; Torch',torch.__version__,'built-for CUDA',torch.version.cuda)"
      - name: Actual ComfyUI --cpu startup and LTX/H3/SeedVR2/Veda node registry
        id: nodecheck
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs --tail 115 universal-slim-cpu || true; docker rm -f universal-slim-cpu >/dev/null 2>&1 || true' EXIT
          docker run --detach --name universal-slim-cpu --network none --memory 6g --cpus 2 \
            --pids-limit 512 --cap-drop ALL --security-opt no-new-privileges \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            "$OCI_IMAGE" python main.py --cpu --listen 127.0.0.1 --port 8188 --disable-auto-launch
          ready=0
          for i in $(seq 1 90); do
            if docker exec universal-slim-cpu python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8188/system_stats',timeout=2).status == 200" >/dev/null 2>&1; then ready=1; break; fi
            if [[ "$(docker inspect -f '{{.State.Running}}' universal-slim-cpu)" != true ]]; then echo 'CPU ComfyUI exited' >&2; exit 1; fi
            sleep 4
          done
          if (( ready != 1 )); then echo 'CPU startup timeout' >&2; exit 1; fi
          # Capture only public node identifiers, never secrets/weights. A GitHub
          # Actions artifact NAME exposes missing node IDs via anonymous API,
          # since raw job logs require logged-in GitHub permissions.
          set +e
          node_output=$(docker exec universal-slim-cpu python -c "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8188/object_info',timeout=100)); must=('ComfyUILTX25MSRICLoRALoader','ComfyUILTX25MSRMultiReferenceGuide','LTXVLatentUpsampler','MiniMaxH3EasyLoader','MiniMaxH3Easy','MiniMaxH3EasyOutput','VedaSparseAttention','SeedVR2LoadDiTModel','SeedVR2VideoUpscaler','H3FaceSelect','H3FaceStitch','TextEncodeQwenImage21'); missing=[x for x in must if x not in d]; print('NODE_RESULT='+('PASS' if not missing else 'MISSING_'+','.join(missing)),flush=True); print('REGISTERED_COUNT='+str(len(d)),flush=True); sys.exit(0 if not missing else 7)" 2>&1)
          node_status=$?
          set -e
          printf '%s\n' "$node_output" | tee "$RUNNER_TEMP/universal-slim-cpu-diagnosis.txt"
          result=$(printf '%s\n' "$node_output" | sed -n 's/^NODE_RESULT=//p' | head -n 1 | tr -cd 'A-Za-z0-9_,.-' | cut -c 1-176)
          echo "fingerprint=${result:-NODE_PROBE_FAILED}" >> "$GITHUB_OUTPUT"
          if (( node_status != 0 )); then echo 'Node list check did not pass; see artifact NAME / diagnostic text.' >&2; exit "$node_status"; fi
          echo 'PASS universal public node registration.'
      - name: Publish public-safe node diagnostic artifact name
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-node-diagnostic-${{ steps.nodecheck.outputs.fingerprint || 'UNKNOWN' }}
          path: ${{ runner.temp }}/universal-slim-cpu-diagnosis.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Always cleanup test container
        if: always()
        shell: bash
        run: |
          docker rm -f universal-slim-cpu >/dev/null 2>&1 || true
          echo 'HF GPU: no Job created; no paid GPU. HF root launch gate unchanged.'
